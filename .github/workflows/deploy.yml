name: Deploy to GitHub Pages

on:
  # Publica a cada push na branch principal
  push:
    branches: [main]
  # Permite disparar manualmente pela aba Actions
  workflow_dispatch:

# Permissões necessárias para o deploy oficial do Pages via Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Garante um deploy por vez; cancela execuções antigas em andamento
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Opcionais: sem eles o app publica em modo só-local (sem sync).
          # Cadastre em Settings → Secrets and variables → Actions → Variables.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
